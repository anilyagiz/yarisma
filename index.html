<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Yarışması - Sınıf Versiyonu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 195, 113, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            background: linear-gradient(145deg, #2d4059 0%, #1a2942 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(78, 205, 196, 0.3);
            max-width: 900px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            padding: 25px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 3px solid rgba(78, 205, 196, 0.3);
        }

        h1 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 2em;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.5);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3); }
            to { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.8); }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            gap: 20px;
        }

        .team-score {
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .team-score.leading {
            font-size: 1.8em !important;
            font-weight: 900 !important;
            transform: scale(1.1);
            animation: leaderPulse 1.5s ease-in-out infinite;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }

        @keyframes leaderPulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.15); }
        }

        .team-a {
            background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);
        }

        .team-b {
            background: linear-gradient(135deg, #4ecdc4 0%, #1a8f8a 100%);
        }

        .question-counter {
            font-size: 1.2em;
            color: #ffd700;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .question {
            font-size: 1.3em;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.5;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.2) 0%, rgba(85, 98, 112, 0.3) 100%);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(78, 205, 196, 0.4);
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 18px;
            font-size: 1.1em;
            border: 3px solid rgba(78, 205, 196, 0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.3) 0%, rgba(85, 98, 112, 0.4) 100%);
        }

        .option-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.4) 0%, rgba(85, 98, 112, 0.5) 100%);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%) !important;
            animation: correctPulse 0.8s ease-in-out;
            border-color: #8ce99a !important;
            box-shadow: 0 0 30px rgba(81, 207, 102, 0.8) !important;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            25% { transform: scale(1.1) rotate(2deg); }
            50% { transform: scale(1.05) rotate(-2deg); }
            75% { transform: scale(1.1) rotate(1deg); }
            100% { transform: scale(1); }
        }

        .team-section {
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15) 0%, rgba(78, 205, 196, 0.15) 100%);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .team-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .team-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .team-btn {
            padding: 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
            font-size: 1em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .team-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .team-btn.selected {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            color: white;
            border-color: #8ce99a;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(81, 207, 102, 0.6);
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .control-btn {
            padding: 15px 28px;
            font-size: 1.1em;
            border: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .show-answer-btn {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            border-color: #8ce99a;
        }

        .show-answer-btn:hover {
            background: linear-gradient(135deg, #69db7c 0%, #51cf66 100%);
        }

        .next-btn {
            background: linear-gradient(135deg, #ffd93d 0%, #f6c23e 100%);
            border-color: #ffe66d;
            color: #2d3436;
        }

        .next-btn:hover {
            background: linear-gradient(135deg, #ffe66d 0%, #ffd93d 100%);
        }

        .start-btn {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            border-color: #8ce99a;
            padding: 20px 40px;
            font-size: 1.3em;
            animation: startPulse 2s ease-in-out infinite;
        }

        @keyframes startPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 30px rgba(81, 207, 102, 0.6); }
        }

        .restart-btn {
            background: linear-gradient(135deg, #ffd93d 0%, #f6c23e 100%);
            border-color: #ffe66d;
            padding: 20px 40px;
            font-size: 1.3em;
            color: #2d3436;
        }

        .control-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(1);
        }

        .hidden {
            display: none;
        }

        .result-screen {
            text-align: center;
        }

        .winner {
            font-size: 2.5em;
            margin: 30px 0;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.8);
            animation: winnerAnim 2s ease-in-out infinite;
        }

        @keyframes winnerAnim {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-2deg); }
            75% { transform: scale(1.1) rotate(2deg); }
        }

        .final-scores {
            font-size: 1.5em;
            margin: 30px 0;
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 15px;
                max-width: 100%;
                max-height: 98vh;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 12px;
            }

            .score-board {
                flex-direction: row;
                gap: 8px;
                padding: 12px;
                margin-bottom: 12px;
            }

            .team-score {
                font-size: 0.95em;
            }

            .team-score.leading {
                font-size: 1.3em !important;
            }

            .question-counter {
                font-size: 0.9em;
                margin-bottom: 10px;
            }

            .question {
                font-size: 1.05em;
                padding: 15px;
                margin-bottom: 12px;
            }

            .options {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 15px;
            }

            .option-btn {
                padding: 14px;
                font-size: 0.95em;
            }

            .team-section {
                margin: 12px 0;
                padding: 12px;
            }

            .team-title {
                font-size: 1em;
                margin-bottom: 10px;
            }

            .team-buttons {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }

            .team-btn {
                padding: 10px;
                font-size: 0.9em;
            }

            .control-buttons {
                flex-direction: column;
                gap: 8px;
                margin-top: 15px;
            }

            .control-btn {
                padding: 12px 20px;
                font-size: 0.95em;
            }

            .start-btn, .restart-btn {
                padding: 15px 30px;
                font-size: 1.1em;
            }

            .winner {
                font-size: 1.4em;
            }

            .final-scores {
                font-size: 1.1em;
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.3em;
                margin-bottom: 10px;
            }

            .score-board {
                padding: 10px;
            }

            .team-score {
                font-size: 0.85em;
            }

            .team-score.leading {
                font-size: 1.15em !important;
            }

            .question {
                font-size: 0.95em;
                padding: 12px;
            }

            .option-btn {
                padding: 12px;
                font-size: 0.85em;
            }

            .team-section {
                padding: 10px;
            }

            .team-title {
                font-size: 0.9em;
            }

            .team-btn {
                padding: 8px;
                font-size: 0.85em;
            }

            .control-btn {
                padding: 10px 15px;
                font-size: 0.85em;
            }

            .start-btn, .restart-btn {
                padding: 12px 25px;
                font-size: 1em;
            }

            .winner {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Başlangıç Ekranı -->
        <div id="startScreen" class="screen">
            <h1>🌍 COĞRAFİ KOORDİNATLAR YARIŞMASI 🗺️</h1>
            <div class="score-board">
                <div class="team-score team-a">🔴 A Grubu: <span id="scoreA">0</span></div>
                <div class="team-score team-b">🔵 B Grubu: <span id="scoreB">0</span></div>
            </div>
            <button class="control-btn start-btn" onclick="startQuiz()">🚀 Yarışmayı Başlat! 🚀</button>
        </div>

        <!-- Soru Ekranı -->
        <div id="questionScreen" class="screen hidden">
            <div class="score-board">
                <div class="team-score team-a">🔴 A Grubu: <span id="scoreA2">0</span></div>
                <div class="team-score team-b">🔵 B Grubu: <span id="scoreB2">0</span></div>
            </div>

            <div class="question-counter">📝 Soru <span id="currentQuestion">1</span> / <span id="totalQuestions">16</span></div>

            <div class="question" id="questionText"></div>

            <div class="options" id="optionsContainer"></div>

            <div class="team-section">
                <div class="team-title team-a">🔴 A Grubu Cevabı:</div>
                <div class="team-buttons" id="teamAButtons"></div>
            </div>

            <div class="team-section">
                <div class="team-title team-b">🔵 B Grubu Cevabı:</div>
                <div class="team-buttons" id="teamBButtons"></div>
            </div>

            <div class="control-buttons">
                <button class="control-btn show-answer-btn" id="showAnswerBtn" onclick="showAnswer()" disabled>✅ Doğru Cevabı Göster</button>
                <button class="control-btn next-btn" id="nextBtn" onclick="nextQuestion()" disabled>➡️ Sonraki Soru</button>
            </div>
        </div>

        <!-- Sonuç Ekranı -->
        <div id="resultScreen" class="screen hidden">
            <h1>🎊 Yarışma Bitti! 🎊</h1>
            <div class="winner" id="winnerText"></div>
            <div class="final-scores">
                <div class="team-score team-a">🔴 A Grubu: <span id="finalScoreA">0</span></div>
                <div class="team-score team-b">🔵 B Grubu: <span id="finalScoreB">0</span></div>
            </div>
            <button class="control-btn restart-btn" onclick="restartQuiz()">🔄 Yeniden Başlat</button>
        </div>
    </div>

    <script>
        // Sorular veritabanı - Coğrafi Koordinatlar Yarışması
        const sorular = [
            {
                soru: "Dünya üzerinde bir yerin paralel ve meridyenlere göre konumuna ne ad verilir?",
                secenekler: ["Göreceli Konum", "Mutlak Konum", "Siyasi Konum", "Coğrafi İşaret"],
                dogru: 1
            },
            {
                soru: "Bir yerin okyanuslara, kıtalara veya önemli yerlere göre olan özel durumu hangi konum türü ile ifade edilir?",
                secenekler: ["Mutlak Konum", "Göreceli Konum", "Dikey Konum", "Yöresel Konum"],
                dogru: 1
            },
            {
                soru: "Dünya üzerinde bir yerin konumunu belirlemek için atılan ilk adım nedir?",
                secenekler: ["Başlangıç meridyenini belirlemek.", "Enlem ve boylam derecelerini birleştirmek.", "Başlangıç paraleli (Ekvator) ile kuzey/güney yarım küreyi tespit etmek.", "İlgili yerin kıtalara olan uzaklığını bulmak."],
                dogru: 2
            },
            {
                soru: "Başlangıç meridyeni (Greenwich) ile ilgili aşağıdaki ifadelerden hangisi doğrudur?",
                secenekler: ["Dünya'yı kuzey ve güney yarım küre olarak ikiye ayırır.", "0 derece ile gösterilir ve Dünya'yı doğu ve batı yarım küre olarak ikiye ayırır.", "Boyları Ekvator'dan kutuplara doğru kısalır.", "Sadece doğu yarım kürede dereceleri artar."],
                dogru: 1
            },
            {
                soru: "Ekvator'un kuzeyinde yer alan bir nokta hangi yarım kürede bulunur?",
                secenekler: ["Güney Yarım Küre", "Doğu Yarım Küre", "Batı Yarım Küre", "Kuzey Yarım Küre"],
                dogru: 3
            },
            {
                soru: "Meridyen dereceleri sola doğru (batıya) artıyorsa, bu yer hangi yarım kürededir?",
                secenekler: ["Doğu Yarım Küre", "Batı Yarım Küre", "Kuzey Yarım Küre", "Güney Yarım Küre"],
                dogru: 1
            },
            {
                soru: "Paralellerle ilgili aşağıdaki bilgilerden hangisi yanlıştır?",
                secenekler: ["Ekvator'dan kutuplara doğru boyları kısalır.", "Birbirlerine paralel uzanırlar ve kesişmezler.", "Başlangıç paraleli Ekvator'dur.", "Tüm derecelerinin boyları birbirine eşittir."],
                dogru: 3
            },
            {
                soru: "Meridyenlerin boyları hakkında doğru ifade aşağıdakilerden hangisidir?",
                secenekler: ["Ekvator'dan kutuplara doğru kısalır.", "Bütün meridyenlerin boyları birbirine eşittir.", "Sadece 0 derece meridyeninin boyu en uzundur.", "Kutuplarda boyları en uzundur."],
                dogru: 1
            },
            {
                soru: "Ardışık iki meridyen arasındaki mesafe Ekvator'dan kutuplara doğru gidildikçe nasıl değişir?",
                secenekler: ["Artar.", "Sabit kalır.", "Azalır.", "Önce artar, sonra azalır."],
                dogru: 2
            },
            {
                soru: "Coğrafi konum belirlemede ikinci adım aşağıdakilerden hangisidir?",
                secenekler: ["İlgili yerin paralel derecesini belirlemek.", "Ekvator'a göre kuzey/güney yarım küreyi tespit etmek.", "Başlangıç meridyeni (Greenwich) ile doğu/batı yarım küreyi tespit etmek.", "İlgili yerin en yakın kıtaya olan mesafesini belirlemek."],
                dogru: 2
            },
            {
                soru: "Ekvator'un güneyinde yer alan paralellere ne ad verilir?",
                secenekler: ["Kuzey paralelleri", "Doğu paralelleri", "Güney paralelleri", "Batı paralelleri"],
                dogru: 2
            },
            {
                soru: "Bir yerin konumunun 40 derece Kuzey paraleli ile 30 derece Doğu meridyeninin kesiştiği nokta olarak belirlenmesi, konum belirlemenin kaçıncı adımıdır?",
                secenekler: ["1. Adım", "2. Adım", "3. Adım", "4. Adım"],
                dogru: 2
            },
            {
                soru: "Meridyen dereceleri sağa doğru (doğuya) artıyorsa, bu yer hangi yarım kürededir?",
                secenekler: ["Batı Yarım Küre", "Güney Yarım Küre", "Doğu Yarım Küre", "Kuzey Yarım Küre"],
                dogru: 2
            },
            {
                soru: "Paraleller ve meridyenler arasındaki temel farklardan biri aşağıdakilerden hangisidir?",
                secenekler: ["Paraleller bir kutuptan diğerine uzanırken, meridyenler Ekvator'a paraleldir.", "Paraleller tam dairedir ve birbirini kesmez; meridyenler ise yarım dairedir ve kutup noktalarında kesişirler.", "Paralellerin dereceleri Ekvator'dan kutuplara doğru azalır, meridyenlerin dereceleri artar.", "Meridyenler boylamları gösterir, paraleller ise saat dilimlerini."],
                dogru: 1
            }
        ];

        // Oyun durumu
        let currentQuestionIndex = 0;
        let scoreA = 0;
        let scoreB = 0;
        let teamAAnswer = null;
        let teamBAnswer = null;
        let answerShown = false;

        // Ses efekti (Base64 encoded ding sound)
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playDingSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            scoreA = 0;
            scoreB = 0;
            teamAAnswer = null;
            teamBAnswer = null;
            answerShown = false;
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');
            
            updateScores();
            loadQuestion();
        }

        function loadQuestion() {
            const question = sorular[currentQuestionIndex];
            
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = sorular.length;
            document.getElementById('questionText').textContent = question.soru;
            
            // Seçenekleri yükle
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.secenekler.forEach((secenek, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = `${index + 1}. ${secenek}`;
                button.id = `option-${index}`;
                optionsContainer.appendChild(button);
            });
            
            // Takım butonlarını oluştur
            createTeamButtons();
            
            // Butonları sıfırla
            teamAAnswer = null;
            teamBAnswer = null;
            answerShown = false;
            document.getElementById('showAnswerBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
        }

        function createTeamButtons() {
            const teamAButtons = document.getElementById('teamAButtons');
            const teamBButtons = document.getElementById('teamBButtons');

            teamAButtons.innerHTML = '';
            teamBButtons.innerHTML = '';

            for (let i = 0; i < 4; i++) {
                // A Grubu butonları
                const btnA = document.createElement('button');
                btnA.className = 'team-btn';
                btnA.textContent = i + 1;
                btnA.onclick = () => selectTeamAnswer('A', i);
                btnA.id = `teamA-${i}`;
                teamAButtons.appendChild(btnA);

                // B Grubu butonları
                const btnB = document.createElement('button');
                btnB.className = 'team-btn';
                btnB.textContent = i + 1;
                btnB.onclick = () => selectTeamAnswer('B', i);
                btnB.id = `teamB-${i}`;
                teamBButtons.appendChild(btnB);
            }
        }

        function selectTeamAnswer(team, answerIndex) {
            if (answerShown) return;

            if (team === 'A') {
                teamAAnswer = answerIndex;
                // A Grubu butonlarını güncelle
                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`teamA-${i}`);
                    btn.classList.toggle('selected', i === answerIndex);
                }
            } else {
                teamBAnswer = answerIndex;
                // B Grubu butonlarını güncelle
                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`teamB-${i}`);
                    btn.classList.toggle('selected', i === answerIndex);
                }
            }

            // Her iki takım da cevap verdiyse otomatik olarak doğru cevabı göster
            if (teamAAnswer !== null && teamBAnswer !== null) {
                setTimeout(() => showAnswer(), 500); // 0.5 saniye bekle
            }
        }

        function showAnswer() {
            if (answerShown) return;
            
            answerShown = true;
            const question = sorular[currentQuestionIndex];
            
            // Doğru cevabı yeşile boyala
            const correctOption = document.getElementById(`option-${question.dogru}`);
            correctOption.classList.add('correct');
            
            // Ses efekti çal
            playDingSound();
            
            // Puanları güncelle
            if (teamAAnswer === question.dogru) {
                scoreA++;
            }
            if (teamBAnswer === question.dogru) {
                scoreB++;
            }
            
            updateScores();
            
            // "Sonraki Soru" butonunu aktif et
            document.getElementById('showAnswerBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex >= sorular.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        function updateScores() {
            // Skorları güncelle
            document.getElementById('scoreA').textContent = scoreA;
            document.getElementById('scoreB').textContent = scoreB;
            document.getElementById('scoreA2').textContent = scoreA;
            document.getElementById('scoreB2').textContent = scoreB;

            // Önde olan takıma "leading" class'ını ekle
            const scoreAElements = [document.getElementById('scoreA').parentElement, document.getElementById('scoreA2').parentElement];
            const scoreBElements = [document.getElementById('scoreB').parentElement, document.getElementById('scoreB2').parentElement];

            scoreAElements.forEach(el => el.classList.remove('leading'));
            scoreBElements.forEach(el => el.classList.remove('leading'));

            if (scoreA > scoreB) {
                scoreAElements.forEach(el => el.classList.add('leading'));
            } else if (scoreB > scoreA) {
                scoreBElements.forEach(el => el.classList.add('leading'));
            }
        }

        function showResults() {
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            document.getElementById('finalScoreA').textContent = scoreA;
            document.getElementById('finalScoreB').textContent = scoreB;
            
            let winnerText = '';
            if (scoreA > scoreB) {
                winnerText = '🏆🎉 A GRUBU KAZANDI! 🎉🏆';
            } else if (scoreB > scoreA) {
                winnerText = '🏆🎉 B GRUBU KAZANDI! 🎉🏆';
            } else {
                winnerText = '🤝✨ BERABERE! HER İKİ TAKIMDA SÜPER! ✨🤝';
            }
            
            document.getElementById('winnerText').textContent = winnerText;
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            
            // Skorları sıfırla
            scoreA = 0;
            scoreB = 0;
            updateScores();
        }

        // Sayfa yüklendiğinde skorları güncelle
        updateScores();
    </script>
</body>
</html>
